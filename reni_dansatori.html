<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crăciun magic</title><style>body{margin:0;overflow:hidden;background:#08142c;color:white;font-family:Georgia}canvas{display:block}header{position:absolute;top:5%;width:100%;text-align:center;pointer-events:none}h1{font-size:clamp(36px,7vw,86px);margin:0;color:#ffe8ac;text-shadow:0 0 30px #e7a84e}p{letter-spacing:4px}button{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#8e1738;color:white;border:1px solid #ffd99a;border-radius:30px;padding:14px 25px;cursor:pointer}</style><header><h1>Crăciun fericit!</h1><p>NOAPTEA RENILOR DANSATORI</p></header><button id="toggle">❄ Oprește dansul</button><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const s=new T.Scene();s.background=new T.Color(0x08142c);s.fog=new T.FogExp2(0x08142c,.026);const c=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,150);c.position.set(0,5.6,16);c.lookAt(0,2.8,0);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;document.body.appendChild(r.domElement);s.add(new T.HemisphereLight(0xc9ddff,0x98735b,2));const light=new T.DirectionalLight(0xffdfb0,3);light.position.set(5,10,6);s.add(light);const mat=(color,emissive=0)=>new T.MeshStandardMaterial({color,emissive,emissiveIntensity:1});const snow=mat(0xeaf4ff),brown=mat(0xa45b32),cream=mat(0xffd5a1),dark=mat(0x38221e),red=mat(0xc71938),glow=mat(0xff2222,0xff2222),gold=mat(0xffcc55,0x996000);function mesh(g,m,p,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);p.add(o);return o}function ball(p,m,x,y,z,a,b=a,d=a){const o=mesh(new T.SphereGeometry(1,24,16),m,p,x,y,z);o.scale.set(a,b,d);return o}function rod(p,m,a,b,w){const A=new T.Vector3(...a),B=new T.Vector3(...b),v=B.clone().sub(A);const o=mesh(new T.CylinderGeometry(w,w,v.length(),10),m,p,...A.clone().add(B).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());return o}mesh(new T.CylinderGeometry(50,50,.3,80),snow,s,0,-.2,0);const tree=new T.Group();s.add(tree);mesh(new T.CylinderGeometry(.24,.4,1.2),brown,tree,0,.6,0);const greens=[0x075b45,0x087452,0x0b8960].map(x=>mat(x));for(let i=0;i<5;i++){let y=1.2+i*.76,rad=2.05-i*.34;mesh(new T.ConeGeometry(rad,2.1,48),greens[i%3],tree,0,y+.7,0)}const bulbs=[];for(let i=0;i<100;i++){let y=.9+i*.045,rad=2.05*(1-(y-.7)/5)+.12,a=i*.61;let m=mat([0xff4466,0xffd45c,0x55ccff,0xc47aff][i%4]);m.emissive.setHex([0xff4466,0xffd45c,0x55ccff,0xc47aff][i%4]);bulbs.push(ball(tree,m,Math.cos(a)*rad,y,Math.sin(a)*rad,.085))}const shape=new T.Shape();for(let i=0;i<10;i++){let a=Math.PI/2+i*Math.PI/5,rr=i%2?.25:.58;let x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?shape.lineTo(x,y):shape.moveTo(x,y)}shape.closePath();const star=mesh(new T.ExtrudeGeometry(shape,{depth:.12,bevelEnabled:true,bevelSize:.04,bevelThickness:.04}),gold,tree,0,5.65,0);for(let i=0;i<12;i++){let a=i*2.4,rr=1.2+(i%3)*.48;let p=new T.Group();p.position.set(Math.cos(a)*rr,.27,Math.sin(a)*rr);p.rotation.y=a;s.add(p);mesh(new T.BoxGeometry(.55,.54,.55),mat([0xc41b40,0x176b78,0x583c9e][i%3]),p,0,0,0);mesh(new T.BoxGeometry(.12,.56,.57),gold,p,0,0,0);mesh(new T.BoxGeometry(.57,.56,.12),gold,p,0,0,0)}
const deer=[];for(let i=0;i<5;i++){const root=new T.Group();s.add(root);const body=new T.Group();root.add(body);ball(body,brown,0,1.02,0,.43,.59,.32);ball(body,cream,0,1.03,.26,.28,.43,.12);ball(body,brown,0,1.85,0,.43,.42,.36);ball(body,cream,0,1.69,.31,.31,.23,.22);ball(body,glow,0,1.77,.51,.14);for(let side of [-1,1]){ball(body,dark,side*.17,1.96,.31,.065);ball(body,snow,side*.17-.016,1.98,.36,.023);const ear=ball(body,brown,side*.45,1.99,0,.22,.11,.1);ear.rotation.z=side*.45;rod(body,dark,[side*.24,2.13,0],[side*.38,2.72,0],.045);rod(body,dark,[side*.32,2.4,0],[side*.62,2.57,0],.038);rod(body,dark,[side*.36,2.58,0],[side*.15,2.75,0],.035)}mesh(new T.ConeGeometry(.32,.53,24),red,body,0,2.35,0);mesh(new T.CylinderGeometry(.33,.33,.11,24),snow,body,0,2.13,0);ball(body,snow,0,2.64,0,.105);mesh(new T.TorusGeometry(.27,.07,10,30),red,body,0,1.43,0).rotation.x=Math.PI/2;ball(body,gold,0,1.38,.31,.09);const limbs=[];for(let j=0;j<4;j++){let side=j%2?1:-1,arm=j<2;let pivot=new T.Group();pivot.position.set(side*(arm?.34:.21),arm?1.33:.65,0);body.add(pivot);ball(pivot,brown,0,-.23,0,.105,.29,.105);ball(pivot,dark,0,-.48,.04,.13,.12,.15);limbs.push(pivot)}deer.push({root,body,limbs})}
for(let i=0;i<24;i++){let x=(i%12-5.5)*3.6,z=-6-Math.floor(i/12)*5;for(let j=0;j<3;j++)mesh(new T.ConeGeometry(1.3-j*.27,2.7,12),mat(0x123c49),s,x,1.3+j*.85,z)}ball(s, new T.MeshBasicMaterial({color:0xfff0c7}),-9,11,-24,1.7);const n=1800,arr=new Float32Array(n*3);for(let i=0;i<n;i++){arr[i*3]=(Math.random()-.5)*45;arr[i*3+1]=Math.random()*20;arr[i*3+2]=(Math.random()-.5)*35}const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(arr,3));s.add(new T.Points(geo,new T.PointsMaterial({color:0xffffff,size:.065,transparent:true,opacity:.85})));let dance=true,t=0;document.querySelector('#toggle').onclick=e=>{dance=!dance;e.target.textContent=dance?'❄ Oprește dansul':'▶ Pornește dansul'};let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000);last=now;if(dance)t+=dt;deer.forEach(({root,body,limbs},i)=>{let a=(i-2)*.61;root.position.set(Math.sin(a)*5.5,0,Math.cos(a)*3.5+.4);root.rotation.y=-a*.35+Math.sin(t*2+i)*.22;let b=t*5+i*.65;body.position.y=Math.abs(Math.sin(b))*.27;body.rotation.z=Math.sin(b)*.16;limbs.forEach((l,j)=>{l.rotation.x=Math.sin(b+j*Math.PI)*.65;l.rotation.z=j<2?(j%2?1:-1)*(.85+.55*Math.sin(b)):Math.sin(b+j)*.22})});star.rotation.y=Math.sin(t)*.5;bulbs.forEach((b,i)=>b.material.emissiveIntensity=1.3+.9*Math.sin(t*3+i));for(let i=0;i<n;i++){arr[i*3+1]-=dt*(.65+i%5*.12);arr[i*3]+=.13*dt;if(arr[i*3+1]<0)arr[i*3+1]=20}geo.attributes.position.needsUpdate=true;r.render(s,c)}requestAnimationFrame(frame);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></html>
